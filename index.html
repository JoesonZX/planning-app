<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://api.github.com https://open.bigmodel.cn; img-src 'self' data:; style-src 'self'; script-src 'self'">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>规划</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🧭 规划</h1>
  <span id="conn" class="dim">未连接</span>
</header>

<main>
  <section id="view-dashboard" class="view"><div id="dash-body" class="md"></div></section>

  <section id="view-reports" class="view">
    <div id="report-chips"></div>
    <div id="report-body" class="md"></div>
  </section>

  <section id="view-calendar" class="view"><div id="cal-body"></div></section>

  <section id="view-files" class="view">
    <div id="file-list"></div>
  </section>

  <section id="view-chat" class="view chat">
    <div class="chat-bar">
      <select id="chat-model">
        <option value="glm-5.3">GLM-5.3</option>
        <option value="glm-5.3-flash">GLM-5.3-flash（免费）</option>
      </select>
      <label class="think"><input type="checkbox" id="chat-thinking"> 思考</label>
      <button id="chat-clear" class="mini">清空</button>
    </div>
    <div id="chat-usage" class="dim small"></div>
    <div id="chat-status" class="dim small"></div>
    <div id="chat-messages"></div>
    <div class="chat-input-row">
      <textarea id="chat-input" rows="1" placeholder="问点什么…（Enter 发送）"></textarea>
      <button id="chat-send">↑</button>
    </div>
  </section>

  <section id="view-settings" class="view">
    <h2>GitHub</h2>
    <label>PAT（fine-grained，仅 planning-data 仓库，Contents 读写）</label>
    <input id="set-pat" type="password" placeholder="github_pat_…">
    <label>仓库</label>
    <input id="set-repo" type="text">
    <h2>GLM 聊天</h2>
    <label>GLM API Key（bigmodel 开放平台）</label>
    <input id="set-glm" type="password" placeholder="粘贴 key">
    <label>聊天预算（USD/月，超帽自动拦截 5.3）</label>
    <input id="set-budget" type="number" step="0.5">
    <label>5.3 输入单价（USD / 百万 tokens，0 = 不计费）</label>
    <input id="set-pricein" type="number" step="0.001">
    <label>5.3 输出单价（USD / 百万 tokens）</label>
    <input id="set-priceout" type="number" step="0.001">
    <div id="set-usage" class="dim small"></div>
    <button id="btn-save-settings" class="primary">保存并连接</button>
    <h2>危险区</h2>
    <button id="btn-clear-local">清空本浏览器数据</button>
  </section>
</main>

<button id="fab" title="随手记">＋</button>

<div id="capture-sheet" class="sheet">
  <h3>随手记 → inbox</h3>
  <textarea id="capture-input" rows="3" placeholder="想到什么写什么，周日自动分拣"></textarea>
  <label class="row"><input type="checkbox" id="capture-task" checked> 任务格式（- [ ]）</label>
  <div class="row">
    <button id="capture-cancel">取消</button>
    <button id="capture-save" class="primary">记下</button>
  </div>
</div>

<div id="file-viewer" class="overlay">
  <div class="filebar">
    <button id="btn-close-file">←</button>
    <strong id="file-title"></strong>
    <button id="btn-edit">编辑</button>
  </div>
  <div id="file-body" class="md"></div>
  <textarea id="file-editor" rows="14" class="hidden"></textarea>
  <button id="btn-save" class="primary hidden">保存到 GitHub</button>
</div>

<div id="toast"></div>
<div id="loading"></div>

<nav>
  <button class="tab-btn active" data-tab="dashboard">🧭 仪表盘</button>
  <button class="tab-btn" data-tab="reports">🌙 报告</button>
  <button class="tab-btn" data-tab="calendar">📅 日历</button>
  <button class="tab-btn" data-tab="files">📂 文件</button>
  <button class="tab-btn" data-tab="chat">💬 聊天</button>
  <button class="tab-btn" data-tab="settings">⚙️ 设置</button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
